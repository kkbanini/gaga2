name: Build Android APK

on:
  push:
    branches:
      - claude/diep-io-mobile-game-j3hy0u
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: npm install

      - name: Sync bundled fallback game (docs/game.html -> www/game.html)
        run: npm run sync:game

      - name: Add Android platform
        run: npx cordova platform add android

      - name: Build debug APK
        run: npx cordova build android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tank-arena-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
