        var hx = p.x + Math.cos(mnt) * (n2 > 1 ? R * 0.55 : 0);
        var hy = p.y + Math.sin(mnt) * (n2 > 1 ? R * 0.55 : 0);
        ctx.beginPath();
        ctx.arc(hx, hy, R * (n2 > 1 ? 0.3 : 0.5), 0, Math.PI * 2);
        ctx.fillStyle = "#c9a0e8";
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#8a63b0";
        ctx.stroke();
      }
    }
    ctx.restore(); // end invisAlpha group

    // HP bar above the tank (always full opacity so it stays readable).
    var barW = R * 2.2;
    var ratio = Math.max(player.hp / player.maxHp, 0);
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fillRect(p.x - barW / 2, p.y - R - 18, barW, 6);
    ctx.fillStyle = ratio > 0.3 ? "#4caf50" : "#e05353";
    ctx.fillRect(p.x - barW / 2, p.y - R - 18, barW * ratio, 6);

    // Username plate above the tank.
    ctx.globalAlpha = player.invisAlpha;
    ctx.fillStyle = (TEAM[player.team] || TEAM.ffa).name;
    ctx.font = "700 14px -apple-system, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(player.name || "mango", p.x, p.y - R - 26);
    ctx.textAlign = "left";
    ctx.globalAlpha = 1;
  }

  function drawStick(stick, label) {
    if (!stick.active) return;
    ctx.beginPath();
    ctx.arc(stick.originX, stick.originY, stick.maxRadius, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.10)";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(stick.knobX, stick.knobY, 26, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.fill();
  }

  // Left inset for all top-left HUD/controls, honoring the notch safe area.
  function hudPadX() { return 16 + safe.left; }
  function hudPadY() { return 16 + safe.top; }

  function drawHUD() {
    // HP + level + XP bar, fixed in screen space (drawn outside the camera
    // transform) so it never scrolls with the world, and positioned as a
    // fraction of view size so it adapts to any screen/orientation.
    var px = hudPadX(), py = hudPadY();
    var barW = Math.min(280, view.w * 0.4);

    ctx.font = "600 16px -apple-system, system-ui, sans-serif";
    ctx.fillStyle = "#fff";
    var title = "Level " + player.level;
    if (player.tankClass) title += "  ·  " + CLASSES[player.tankClass].label;
    ctx.fillText(title, px, py + 16);

    // XP bar
    var xpRatio = clamp(player.xp / player.xpToNext, 0, 1);
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fillRect(px, py + 24, barW, 8);
    ctx.fillStyle = "#f2c14e";
    ctx.fillRect(px, py + 24, barW * xpRatio, 8);

    // HP bar
    var hpRatio = clamp(player.hp / player.maxHp, 0, 1);
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fillRect(px, py + 40, barW, 10);
    ctx.fillStyle = hpRatio > 0.3 ? "#4caf50" : "#e05353";
    ctx.fillRect(px, py + 40, barW * hpRatio, 10);
    ctx.fillStyle = "#fff";
    ctx.font = "600 11px -apple-system, system-ui, sans-serif";
    ctx.fillText(Math.max(0, Math.round(player.hp)) + " / " + player.maxHp, px, py + 60);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Wraps text within maxWidth, drawing each line centered at cx starting at y.
  // ctx.font/fillStyle/textAlign must already be set by the caller.
  function wrapText(text, cx, y, maxWidth, lineHeight) {
    var words = text.split(" ");
    var line = "";
    var ly = y;
    for (var i = 0; i < words.length; i++) {
      var test = line + words[i] + " ";
      if (ctx.measureText(test).width > maxWidth && line !== "") {
        ctx.fillText(line, cx, ly);
        line = words[i] + " ";
        ly += lineHeight;
      } else {
        line = test;
      }
    }
    ctx.fillText(line, cx, ly);
  }

  // The Status button sits directly under the HP bar (HUD ends around
  // py+63 — see drawHUD), collapsed by default. Recomputed each call so it
  // stays correctly placed across resize/orientation/safe-area changes.
  function getStatusButtonRect() {
    return { x: hudPadX(), y: hudPadY() + 68, w: Math.min(130, view.w * 0.32), h: 32 };
  }

  function drawStatusButton() {
    var r = getStatusButtonRect();
    var hasPoints = player.skillPoints > 0;

    roundRect(r.x, r.y, r.w, r.h, 8);
    ctx.fillStyle = hasPoints ? "rgba(255,213,74,0.92)" : "rgba(255,255,255,0.10)";
    ctx.fill();
    ctx.lineWidth = hasPoints ? 2 : 1;
    ctx.strokeStyle = hasPoints ? "#ffffff" : "rgba(255,255,255,0.2)";
    ctx.stroke();

    ctx.fillStyle = hasPoints ? "#0d0f14" : "rgba(255,255,255,0.6)";
    ctx.font = "700 13px -apple-system, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Status" + (hasPoints ? " (" + player.skillPoints + ")" : ""), r.x + r.w / 2, r.y + r.h / 2 + 4);
    ctx.textAlign = "left";
  }

  // The 8 stat-upgrade buttons, laid out as a compact 2-column grid (4 rows)
  // directly below the Status button. Only meaningful (drawn/hit-tested) while
  // the menu is open AND skill points are available — see drawUpgradeMenu /
  // handleUiTap.
  function getExpandedUpgradeButtons() {
    var sb = getStatusButtonRect();
    var gap = 7, bw = 108, bh = 36, cols = 2;
    var startX = sb.x, startY = sb.y + sb.h + 8;
    var rects = [];
    for (var i = 0; i < UPGRADES.length; i++) {
      var col = i % cols, row = Math.floor(i / cols);
      rects.push({
        def: UPGRADES[i],
        x: startX + col * (bw + gap),
        y: startY + row * (bh + gap),
        w: bw,
        h: bh
      });
    }
    return rects;
  }

  function drawUpgradeMenu() {
    if (!statusMenuOpen || player.skillPoints <= 0) return;
    var rects = getExpandedUpgradeButtons();

    for (var i = 0; i < rects.length; i++) {
      var rb = rects[i];
      var tier = player.stats[rb.def.key];
      var maxed = tier >= player.maxTier;

      roundRect(rb.x, rb.y, rb.w, rb.h, 6);
      ctx.fillStyle = maxed ? "rgba(255,255,255,0.10)" : rb.def.color;
      ctx.globalAlpha = maxed ? 1 : 0.92;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.lineWidth = maxed ? 1 : 2;
      ctx.strokeStyle = maxed ? "rgba(255,255,255,0.2)" : "#ffffff";
      ctx.stroke();

      ctx.fillStyle = maxed ? "rgba(255,255,255,0.55)" : "#0d0f14";
      ctx.font = "700 11px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(rb.def.label, rb.x + rb.w / 2, rb.y + 15);
      ctx.font = "600 10px -apple-system, system-ui, sans-serif";
      ctx.fillText(maxed ? "MAX" : (tier + "/" + player.maxTier), rb.x + rb.w / 2, rb.y + 29);
      ctx.textAlign = "left";
    }
  }

  // Class-choice cards for the CURRENT evolution options (base classes at L15,
  // otherwise the chosen class's next-tier upgrades). Laid out as a single row
  // in landscape or a 2-column grid in portrait, centered on screen.
  function getEvolutionCards() {
    var opts = evolutionOptions();
    var margin = 20, gap = 16;
    var cols = view.w > view.h ? opts.length : Math.min(opts.length, 2);
    cols = Math.max(cols, 1);
    var rows = Math.ceil(opts.length / cols);
    var cw = (view.w - margin * 2 - gap * (cols - 1)) / cols;
    var ch = Math.min(170, (view.h - margin * 2 - gap * (rows - 1)) / rows);
    var totalW = cw * cols + gap * (cols - 1);
    var totalH = ch * rows + gap * (rows - 1);
    var startX = (view.w - totalW) / 2;
    var startY = (view.h - totalH) / 2;
    var cards = [];
    for (var i = 0; i < opts.length; i++) {
      var col = i % cols, row = Math.floor(i / cols);
      var key = opts[i];
      cards.push({
        key: key,
        def: CLASSES[key],
        x: startX + col * (cw + gap),
        y: startY + row * (ch + gap),
        w: cw,
        h: ch
      });
    }
    return cards;
  }

  function drawEvolutionOverlay() {
    ctx.fillStyle = "rgba(5,6,10,0.88)";
    ctx.fillRect(0, 0, view.w, view.h);

    var cards = getEvolutionCards();

    ctx.textAlign = "center";
    ctx.fillStyle = "#fff";
    ctx.font = "700 20px -apple-system, system-ui, sans-serif";
    var tierNum = player.classTier + 1; // the tier being chosen
    ctx.fillText("Evolve — Tier " + tierNum + " (Level " + player.level + ")", view.w / 2, Math.max(28 + safe.top, cards[0].y - 20));

    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];
      roundRect(c.x, c.y, c.w, c.h, 10);
      ctx.fillStyle = c.def.color;
      ctx.globalAlpha = 0.92;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();

      ctx.fillStyle = "#0d0f14";
      ctx.font = "700 16px -apple-system, system-ui, sans-serif";
      ctx.fillText(c.def.label, c.x + c.w / 2, c.y + 28);
      ctx.font = "500 12px -apple-system, system-ui, sans-serif";
      wrapText(c.def.desc, c.x + c.w / 2, c.y + 50, c.w - 20, 15);
    }
    ctx.textAlign = "left";
  }

  // Remote players/bullets from the multiplayer scaffold. No-ops while offline
  // (maps stay empty), so this is free in single-player.
  // Live remote players (real friends): full tank with class barrels, team
  // colour, nameplate, level, and HP bar.
  function drawRemotePlayers() {
    for (var ri = 0; ri < remotes.length; ri++) {
      var rp = remotes[ri];
      var p = worldToScreen(rp.x, rp.y);
      if (p.x < -80 || p.x > view.w + 80 || p.y < -80 || p.y > view.h + 80) continue;
      var rcls = rp.cls && CLASSES[rp.cls] ? CLASSES[rp.cls] : null;
      var col = TEAM[rp.team] || TEAM.ffa;
      var R = ZS(rp.radius || PLAYER_BASE.radius);
      // barrels (from the class pattern) or rammer spike ring
      if (rcls && rcls.rammer) {
        ctx.save(); ctx.translate(p.x, p.y);
        ctx.beginPath();
        var spikes = rcls.spikes || 6, rO = R + ZS(7);
        for (var s = 0; s < spikes; s++) { var a2 = (s / spikes) * Math.PI * 2; var sx = Math.cos(a2) * rO, sy = Math.sin(a2) * rO; if (s === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy); }
        ctx.closePath(); ctx.fillStyle = "#6f4a94"; ctx.fill(); ctx.restore();
      } else {
        var barrels = rcls ? rcls.barrels : DEFAULT_BARRELS;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(rp.a || 0);
        ctx.fillStyle = "#8fa3b3";
        for (var bi2 = 0; bi2 < barrels.length; bi2++) {
          var br = barrels[bi2];
          ctx.save(); ctx.rotate(br.a || 0);
          ctx.fillRect(0, ZS(br.off || 0) - ZS(14 * (br.w || 1)) / 2, ZS((PLAYER_BASE.radius + 18) * (br.len || 1)), ZS(14 * (br.w || 1)));
          ctx.restore();
        }
        ctx.restore();
      }
      // body
      ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2);
      ctx.fillStyle = rcls && rcls.rammer ? "#b06fd6" : col.body; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = col.stroke; ctx.stroke();
      // HP bar
      if (rp.hp !== undefined && rp.maxHp) {
        var bw = R * 2.2, ratio = Math.max(rp.hp / rp.maxHp, 0);
        ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(p.x - bw / 2, p.y - R - 12, bw, 5);
        ctx.fillStyle = "#4caf50"; ctx.fillRect(p.x - bw / 2, p.y - R - 12, bw * ratio, 5);
      }
      // nameplate (+ level)
      ctx.fillStyle = col.name;
      ctx.font = "700 13px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText((rp.name || "player") + "  ·  Lv" + (rp.level || 1), p.x, p.y - R - 20);
      ctx.textAlign = "left";
    }
  }

  function drawRemoteBullets() {
    for (var i = 0; i < remoteBullets.length; i++) {
      var b = remoteBullets[i];
      var p = worldToScreen(b.x, b.y);
      if (p.x < -40 || p.x > view.w + 40 || p.y < -40 || p.y > view.h + 40) continue;
      ctx.beginPath();
      ctx.arc(p.x, p.y, ZS(b.radius || 6), 0, Math.PI * 2);
      ctx.fillStyle = b.color || "#ffd0c0";
      ctx.fill();
    }
  }

  // Top-right minimap: scales the 6000² world into a small square, honoring the
  // notch safe area. Shows the player, remote players (team-coloured), and a
  // pulsing skull at the boss.
  function getMinimapRect() {
    var size = Math.min(140, view.w * 0.28);
    return { x: view.w - size - 12 - safe.right, y: 12 + safe.top, w: size, h: size };
  }
  function drawSkull(cx, cy, r, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();       // cranium
    ctx.fillRect(cx - r * 0.8, cy, r * 1.6, r * 0.9);                       // jaw
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.arc(cx - r * 0.4, cy - r * 0.1, r * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r * 0.4, cy - r * 0.1, r * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(cx - r * 0.12, cy + r * 0.2, r * 0.24, r * 0.5);           // nose
    ctx.restore();
  }
  function drawMinimap() {
    var m = getMinimapRect();
    ctx.fillStyle = "rgba(20,26,38,0.55)";
    ctx.fillRect(m.x, m.y, m.w, m.h);
    ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.strokeRect(m.x, m.y, m.w, m.h);
    var sx = m.w / WORLD.w, sy = m.h / WORLD.h;
    // remote players (real friends), colour-coded by team
    for (var i = 0; i < remotes.length; i++) {
      var rp = remotes[i];
      ctx.fillStyle = (TEAM[rp.team] || TEAM.ffa).body;
      ctx.beginPath(); ctx.arc(m.x + rp.x * sx, m.y + rp.y * sy, 3, 0, Math.PI * 2); ctx.fill();
    }
    // player
    ctx.fillStyle = gameMode === "teams" ? (TEAM[player.team] || TEAM.ffa).name : "#ffffff";
    ctx.beginPath(); ctx.arc(m.x + player.x * sx, m.y + player.y * sy, 4, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = "#000"; ctx.stroke();
    // boss skull (pulsing)
    if (boss) {
      var pulse = 0.55 + 0.45 * Math.sin(performance.now() / 180);
      drawSkull(m.x + boss.x * sx, m.y + boss.y * sy, 7, pulse);
    }
  }

  function drawBossHealthBar() {
    if (!boss) return;
    // Only when the player is near the center arena.
    if (Math.hypot(boss.x - player.x, boss.y - player.y) > BOSS_NEAR_DIST) return;
    var w = Math.min(460, view.w * 0.7), h = 18;
    var x = (view.w - w) / 2, y = 14 + safe.top;
    ctx.fillStyle = "#fff"; ctx.font = "800 15px -apple-system, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(boss.name, view.w / 2, y - 4);
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(x, y, w, h);
    var ratio = Math.max(boss.hp / boss.maxHp, 0);
    ctx.fillStyle = "#e0455a"; ctx.fillRect(x, y, w * ratio, h);
    ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.strokeRect(x, y, w, h);
    ctx.textAlign = "left";
  }

  function drawBossWarning() {
    if (boss || !bossWarningActive) return;
    if (Math.floor(performance.now() / 400) % 2 === 0) return; // blink
    ctx.fillStyle = "#ff5a5a";
    ctx.font = "800 " + Math.round(Math.min(26, view.w * 0.045)) + "px -apple-system, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("WARNING: A Legendary Boss is spawning at the center!", view.w / 2, view.h * 0.16 + safe.top);
    ctx.textAlign = "left";
  }

  function drawNotif() {
    if (notif.timer <= 0) return;
    ctx.globalAlpha = Math.min(1, notif.timer);
    ctx.fillStyle = "#ffd54a";
    ctx.font = "800 18px -apple-system, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(notif.text, view.w / 2, view.h * 0.24 + safe.top);
    ctx.textAlign = "left";
    ctx.globalAlpha = 1;
  }

  // Live scoreboard (top-centre): local player + connected friends, by score.
  function drawLeaderboard() {
    if (!NET.connected && remotes.length === 0) return; // solo -> skip
    var list = [{ name: player.name, score: player.score || 0, team: player.team, me: true }];
    for (var i = 0; i < remotes.length; i++) {
      list.push({ name: remotes[i].name, score: remotes[i].score || 0, team: remotes[i].team });
    }
    list.sort(function (a, b) { return b.score - a.score; });
    var rows = Math.min(list.length, 6);
    var x = view.w / 2, y = safe.top + 30;
    ctx.textAlign = "center";
    ctx.font = "700 12px -apple-system, system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.fillText(NET.connected ? "PLAYERS ONLINE" : "SCORE", x, y);
    for (var r = 0; r < rows; r++) {
      var e = list[r];
      ctx.fillStyle = (TEAM[e.team] || TEAM.ffa).name;
      ctx.font = (e.me ? "800 " : "600 ") + "13px -apple-system, system-ui, sans-serif";
      ctx.fillText((e.name || "player") + "  " + e.score, x, y + 16 + r * 16);
    }
    ctx.textAlign = "left";
  }

  // Compact "next boss" countdown, pinned to the bottom-right corner and kept
  // small/low-contrast so it never blocks the view. Safe-area aware for phones.
  function drawBossCountdown() {
    var label;
    if (boss) {
      label = "Boss: LIVE";
    } else {
      var t = Math.max(0, Math.ceil(bossTimer));
      var mm = Math.floor(t / 60), ss = t % 60;
      label = "Next Boss: " + (mm < 10 ? "0" + mm : mm) + ":" + (ss < 10 ? "0" + ss : ss);
    }
    var color = (boss || bossWarningActive) ? "#ff6b6b" : "rgba(255,255,255,0.85)";
    var padX = 8, padY = 4, h = 20, gap = 10;
    ctx.font = "700 12px -apple-system, system-ui, sans-serif";
    var w = ctx.measureText(label).width;
    var right = view.w - gap - safe.right;
    var bottom = view.h - gap - safe.bottom;
    var boxX = right - w - padX * 2, boxY = bottom - h;
    // subtle backing pill so the text stays readable over the world
    ctx.fillStyle = "rgba(12,16,24,0.42)";
    roundRect(boxX, boxY, w + padX * 2, h, 6);
    ctx.fill();
    ctx.fillStyle = color;
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillText(label, right - padX, boxY + h / 2 + 0.5);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
  }

  // Sandbox control panel: two stacked buttons tucked under the minimap on the
  // right edge, so they clear the HP HUD (top-left), joysticks (bottom corners)
  // and the boss countdown (bottom-right). Safe-area aware via getMinimapRect().
  function getSandboxButtons() {
    var mm = getMinimapRect();
    var bw = Math.max(mm.w, 96), bh = 34, gap = 8;
    var x = view.w - bw - 12 - safe.right;
    var y0 = mm.y + mm.h + 12;
    return [
      { key: "max",   label: "Max Level",   x: x, y: y0,            w: bw, h: bh },
      { key: "reset", label: "Reset Level", x: x, y: y0 + bh + gap, w: bw, h: bh }
    ];
  }
  function drawSandboxPanel() {
    var btns = getSandboxButtons();
    ctx.font = "700 11px -apple-system, system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.textAlign = "right";
    ctx.fillText("SANDBOX", btns[0].x + btns[0].w, btns[0].y - 5);
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i];
      roundRect(b.x, b.y, b.w, b.h, 8);
      ctx.fillStyle = b.key === "reset" ? "rgba(224,83,83,0.90)" : "rgba(63,182,240,0.92)";
      ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.stroke();
      ctx.fillStyle = "#0d0f14";
      ctx.font = "700 13px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 0.5);
      ctx.textBaseline = "alphabetic";
    }
    ctx.textAlign = "left";
  }

  function render() {
    ctx.clearRect(0, 0, view.w, view.h);
    ctx.fillStyle = "#12141a";
    ctx.fillRect(0, 0, view.w, view.h);

    drawGrid();
    drawWorldBounds();
    drawShapes();
    drawRemoteBullets();
    drawBullets();
    drawDrones();
    drawRemotePlayers();
    drawBoss();
    drawPlayer();

    // Screen-space overlays.
    drawMinimap();
    drawBossHealthBar();
    drawBossWarning();
    drawLeaderboard();
    drawNotif();

    // In-game touch controls / HUD only while actually playing.
    if (gameState === "playing") {
      drawStick(moveStick);
      drawStick(aimStick);
      drawHUD();
      drawStatusButton();
      drawBossCountdown();
      if (gameMode === "sandbox") drawSandboxPanel();
      drawUpgradeMenu();
      if (player.evolutionPending) drawEvolutionOverlay();
    }
  }

  // ======================================================================
  // 8. MAIN LOOP
  //    dt is clamped so a backgrounded tab / dev-tools pause doesn't cause
  //    a huge simulation step (e.g. tank flying through walls) on resume.
  // ======================================================================
  var lastTime = performance.now();

  function frame(now) {
    var dt = Math.min((now - lastTime) / 1000, 1 / 30);
    lastTime = now;

    updatePlayer(dt);
    updateBoss(dt);
    updateDrones(dt);
    updateBullets(dt);
    updateShapes(dt);
    updateRemotes(dt);        // interpolate remote players toward server state
    updateRemoteBullets(dt);  // peers' shots (damage the local player)
    checkCollisions();
    checkCombat(dt);
    updateCamera(dt);
    if (notif.timer > 0) notif.timer -= dt;
    NET.update(dt);           // sync our state to the server (no-op while solo)

    render();

    requestAnimationFrame(frame);
  }

  // ======================================================================
  // 9. LOBBY / MAIN MENU
  // ======================================================================
  var lobbyEl = document.getElementById("lobby");
  var modeSel = document.getElementById("modeSel");
  var teamRow = document.getElementById("teamRow");
  var teamWarn = document.getElementById("teamWarn");
  var nameInput = document.getElementById("nameInput");
  var playBtn = document.getElementById("playBtn");
  var lobbyTeamChoice = "red";

  // Team picker: show only in 2 Teams mode. Actual balancing is done by the
  // server on join (it may reassign you to the smaller side — see NET welcome).
  function refreshTeamUI() {
    var teams = gameMode === "teams";
    teamRow.style.display = teams ? "flex" : "none";
    teamWarn.textContent = teams ? "Server auto-balances teams on join." : "";
    if (!teams) return;
    var btns = teamRow.querySelectorAll(".teamBtn");
    for (var i = 0; i < btns.length; i++) {
      var t = btns[i].getAttribute("data-team");
      btns[i].classList.toggle("selected", lobbyTeamChoice === t);
    }
  }
  function parseMode(v) { return v === "teams" ? "teams" : (v === "sandbox" ? "sandbox" : "ffa"); }
  modeSel.addEventListener("change", function () {
    gameMode = parseMode(modeSel.value);
    refreshTeamUI();
  });
  teamRow.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest(".teamBtn") : null;
    if (!btn) return;
    lobbyTeamChoice = btn.getAttribute("data-team");
    refreshTeamUI();
  });
  function startGame() {
    playerName = (nameInput.value || "").trim().slice(0, 16) || "mango";
    gameMode = parseMode(modeSel.value);
    playerTeam = gameMode === "teams" ? lobbyTeamChoice : "ffa";
    // Fresh player with the chosen identity.
    Object.assign(player, makePlayer());
    bossTimer = BOSS_INTERVAL; boss = null; drones = []; bossWarningActive = false;
    remotes = []; remoteBullets = [];
    notif = { text: "", timer: 0 };
    gameState = "playing";
    lobbyEl.classList.add("hidden");
    // Sandbox is a private, offline testbed — stay solo. Otherwise connect to
    // the multiplayer server (a no-op if no server URL is configured).
    if (gameMode !== "sandbox") NET.start();
  }
  playBtn.addEventListener("click", startGame);
  refreshTeamUI();

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
